name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  python-lint-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r engine/requirements.txt
        pip install flake8 mypy pytest pytest-cov
    - name: Lint with flake8
      run: |
        flake8 engine/app --count --show-source --statistics
    - name: Type check with mypy
      run: |
        mypy --strict engine/app
    - name: Test with pytest
      run: |
        pytest engine/tests --cov=engine/app --cov-fail-under=95

  node-lint-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: "20"
    - name: Install Backend dependencies
      working-directory: ./backend
      run: npm ci
    - name: Backend ESLint
      working-directory: ./backend
      run: npx eslint src --ext .ts
    - name: Backend Type Check
      working-directory: ./backend
      run: npx tsc --noEmit
    - name: Backend Test
      working-directory: ./backend
      run: npm test

  frontend-lint-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: "20"
    - name: Install Frontend dependencies
      working-directory: ./frontend
      run: npm ci
    - name: Frontend ESLint
      working-directory: ./frontend
      run: npm run lint
    - name: Frontend Type Check
      working-directory: ./frontend
      run: npm run type-check
    - name: Frontend Build Verification
      working-directory: ./frontend
      run: npm run build

  docker-verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Verify Docker Compose Config
      run: docker compose config
    - name: Build Images
      run: docker compose build
