version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aibubble_postgres
    environment:
      POSTGRES_DB: aibubble
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d aibubble" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aibubble_redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  engine:
    build:
      context: ./engine
    container_name: aibubble_engine
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
    container_name: aibubble_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://admin:password@postgres:5432/aibubble
      - REDIS_URL=redis://redis:6379
      - PYTHON_ENGINE_URL=http://engine:8000
      - CRON_ENABLED=true
      - INTERNAL_API_SECRET=doomsday_admin_secret_2026
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      engine:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:5000
    container_name: aibubble_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000
      - NEXT_PUBLIC_SITE_URL=http://localhost:3000
      - INTERNAL_API_URL=http://backend:5000
      - INTERNAL_API_URL=http://backend:5000
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
