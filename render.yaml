services:
  - type: web
    name: aibubble-engine
    env: docker
    dockerContext: ./engine
    dockerfilePath: ./engine/Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: LOG_LEVEL
        value: "INFO"

  - type: web
    name: aibubble-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: starter
    healthCheckPath: /api/v1/clock
    envVars:
      - key: PORT
        value: "5000"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ENGINE_URL
        value: "https://aibubble-engine.onrender.com"
      - key: INTERNAL_API_SECRET
        sync: false
      - key: CRON_ENABLED
        value: "true"
